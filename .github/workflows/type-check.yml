name: typing

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'streamable/**'
      - 'tests/**'
      - '.github/workflows/type-check.yml'

jobs:
  typing:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.13.9"
    - name: type-check
      run: make venv type-check
